---
name: Copilot setup steps
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
permissions: {}
jobs:
  # GitHub Copilot coding agent requires this exact job ID.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Install mise tools
        # uv must precede mise: the pipx backend prefers `uv tool install`
        # (uvx) when uv is on PATH, and uv resolves Python 3.14 for cobo
        # (which requires >=3.14). Without uv it falls back to pipx with the
        # system Python and the install fails. Mirrors the CI hooks job order.
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8  # v5.1.2
      - name: Sync dependencies
        run: uv sync
